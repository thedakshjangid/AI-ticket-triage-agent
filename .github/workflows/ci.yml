name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: triage
          POSTGRES_DB: triage
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U triage"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://triage:triage@localhost:5432/triage
      - name: Eval (offline baseline)
        run: python -m evals.run_eval

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t ai-ticket-triage-agent .
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 -e LLM_PROVIDER=mock ai-ticket-triage-agent
          for i in $(seq 1 20); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
